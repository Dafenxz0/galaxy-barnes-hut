[package]
name = "galaxy-barnes-hut"
version = "0.1.0"
edition = "2021"
description = "Real-time N-Body Galaxy Collision & Live Barnes-Hut Quadtree simulation in Rust and WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
